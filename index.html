<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMCO Action - 3D Battle Royale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>IMCO Action</h1>
            <p>لعبة المعركة الملكية التوليدية بالذكاء الاصطناعي</p>
        </header>

        <main>
            <div id="dashboard">
                <div class="canvas-container" style="background: black; width: 100%; height: 200px; display: flex; align-items: center; center; justify-content: center; color: #00ff66; margin-bottom: 15px; border-radius: 8px;">
                    [ محرك العرض المرئي ثلاثي الأبعاد والجزيرة التفاعلية ]
                </div>

                <button class="btn-success" style="width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-bottom: 15px;">
                    ابدأ المعركة التوليدية بالصوت والصورة
                </button>

                <div class="analytics-section" style="background: #1e1e1e; padding: 15px; border-radius: 8px;">
                    <p style="margin-bottom: 10px; color: #aaa;">تحليلات نهاية الجلسة (Post-Match)</p>
                    <button onclick="endSessionAnalysis()" style="width: 100%; padding: 10px; background-color: #dc3545; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        إنهاء الجلسة واستعراض التحليلات
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="game.js"></script>
</body>
</html>
